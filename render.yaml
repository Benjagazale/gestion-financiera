# Render Blueprint — FASE 2: deploy en Render Free
# Documentación completa: docs/DEPLOY.md
services:
  - type: web
    name: agente-financiero
    runtime: python
    plan: free
    branch: dev
    healthCheckPath: /health
    # Los tests corren en cada build: un commit con pruebas rojas no llega a prod
    buildCommand: pip install -r requirements.txt -r requirements-dev.txt && python -m pytest tests -q
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Secretos: se ingresan en el dashboard al crear el servicio (no en el repo)
      - key: DATABASE_URL   # Supabase pooler + ?sslmode=require
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY        # X-API-Key en producción; generar uno aleatorio
        sync: false
      - key: FX_USD_CLP
        value: "950"
